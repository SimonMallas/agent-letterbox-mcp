[build-system]
requires = ["hatchling==1.32.3"]
build-backend = "hatchling.build"

[project]
name = "letterbox-mcp"
version = "0.1.0"
description = "Read-only MCP view of a Letterbox mailbox. CLI and files stay canonical."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "mcp==1.30.0",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2"]

[project.scripts]
letterbox-mcp = "letterbox_mcp.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
